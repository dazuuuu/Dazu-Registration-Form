<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#048C44">
<title>You are offline — Dazu Secretary</title>
<style>
  :root { --g:#048C44; --gd:#037A3B; --gl:#E3F3EA; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f4f5f2; color:#1b1f1d; font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
  .box { text-align:center; max-width:380px; background:#fff; border-radius:24px; padding:32px 26px; box-shadow:0 8px 30px rgba(0,0,0,.06); }
  img { width:84px; height:84px; border-radius:20px; background:var(--gl); }
  h1 { font-size:1.35rem; margin:16px 0 6px; color:var(--gd); } p { color:#5f6964; line-height:1.5; margin:0 0 22px; }
  button { background:var(--g); color:#fff; border:0; border-radius:12px; min-height:48px; padding:0 26px; font-size:1rem; font-weight:700; cursor:pointer; }
  button:hover { background:var(--gd); }
</style>
</head>
<body>
<div class="box">
  <img src="../assets/icons/secretary-192.png" alt="">
  <h1>You are offline</h1>
  <p>There is no internet connection right now. Your portal will open again as soon as you are back online.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</div>
</body>
</html>
