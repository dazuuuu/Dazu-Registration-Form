<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline</title>
<style>
  body { font: 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; min-height: 100vh;
         display: grid; place-items: center; background: #f5f6f8; color: #0f172a; }
  .box { text-align: center; padding: 24px; max-width: 360px; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  p { color: #64748b; }
  button { background: #0D9488; color: #fff; border: 0; border-radius: 8px; padding: 10px 20px; font-size: 15px; }
</style>
</head>
<body>
<div class="box">
  <img src="icons/icon-192.png" alt="">
  <h2>You're offline</h2>
  <p>Check your internet connection. Your portal will load again as soon as you're back online.</p>
  <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
